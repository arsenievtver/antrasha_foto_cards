services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./env/.env.postgres.prod
    volumes:
      - antrasha_pg_data:/var/lib/postgresql/data
    logging:
      driver: loki
      options:
        loki-url: "http://${INFRA_HOST}/loki/api/v1/push"
        loki-external-labels: "app=antrasha,service=postgres"
        loki-batch-size: "400"
        loki-retries: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks:
      - antrasha_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    restart: unless-stopped
    env_file:
      - ./env/.env.backend.prod
      - ./env/.env.postgres.prod
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: loki
      options:
        loki-url: "http://${INFRA_HOST}/loki/api/v1/push"
        loki-external-labels: "app=antrasha,service=backend"
        loki-batch-size: "400"
        loki-retries: "3"
        loki-pipeline-stages: |
          - regex:
              expression: '^(?P<level>DEBUG|INFO|WARNING|ERROR|CRITICAL)'
          - labels:
              level:
    # Только localhost — удобная проверка API до поднятия nginx: curl http://127.0.0.1:8000/health
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ai_ingest_tmp:/app/var/ai_ingest_tmp
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s
    networks:
      - antrasha_net

  ai-ingest-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "jobs.ai_ingest_worker"]
    restart: unless-stopped
    env_file:
      - ./env/.env.backend.prod
      - ./env/.env.postgres.prod
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: loki
      options:
        loki-url: "http://${INFRA_HOST}/loki/api/v1/push"
        loki-external-labels: "app=antrasha,service=ai-ingest-worker"
        loki-batch-size: "400"
        loki-retries: "3"
        loki-pipeline-stages: |
          - regex:
              expression: '^(?P<level>DEBUG|INFO|WARNING|ERROR|CRITICAL)'
          - labels:
              level:
    volumes:
      - ai_ingest_tmp:/app/var/ai_ingest_tmp
    networks:
      - antrasha_net

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - antrasha_net

  admin:
    build:
      context: ..
      dockerfile: admin/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - antrasha_net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    env_file:
      - ./env/.env.prod
    logging:
      driver: loki
      options:
        loki-url: "http://${INFRA_HOST}/loki/api/v1/push"
        loki-external-labels: "app=antrasha,service=nginx"
        loki-batch-size: "400"
        loki-retries: "3"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      admin:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/letsencrypt:/etc/letsencrypt
      - ./nginx/acme:/var/www/certbot
    networks:
      - antrasha_net

  certbot:
    image: certbot/certbot:latest
    profiles: ["ops"]
    volumes:
      - ./nginx/letsencrypt:/etc/letsencrypt
      - ./nginx/acme:/var/www/certbot

volumes:
  antrasha_pg_data:
  ai_ingest_tmp:

networks:
  antrasha_net:
    driver: bridge
