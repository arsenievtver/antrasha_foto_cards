services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./env/.env.postgres.prod
    volumes:
      - antrasha_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks:
      - antrasha_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./env/.env.backend.prod
      - ./env/.env.postgres.prod
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 20s
      timeout: 6s
      retries: 6
      start_period: 20s
    networks:
      - antrasha_net

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - antrasha_net

  admin:
    build:
      context: ..
      dockerfile: admin/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - antrasha_net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    env_file:
      - ./env/.env.prod
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      admin:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/letsencrypt:/etc/letsencrypt
      - ./nginx/acme:/var/www/certbot
    networks:
      - antrasha_net

  certbot:
    image: certbot/certbot:latest
    profiles: ["ops"]
    volumes:
      - ./nginx/letsencrypt:/etc/letsencrypt
      - ./nginx/acme:/var/www/certbot

volumes:
  antrasha_pg_data:

networks:
  antrasha_net:
    driver: bridge
