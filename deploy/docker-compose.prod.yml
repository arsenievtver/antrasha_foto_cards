services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./env/.env.postgres.prod
    volumes:
      - antrasha_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks:
      - antrasha_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - ./env/.env.backend.prod
      - ./env/.env.postgres.prod
    volumes:
      - antrasha_promo_media:/app/data/promo-banners
      - antrasha_ai_ingest_tmp:/app/var/ai_ingest_tmp
      - antrasha_try_on_tmp:/app/var/try_on_tmp
    depends_on:
      postgres:
        condition: service_healthy
    # Только localhost — удобная проверка API до поднятия nginx: curl http://127.0.0.1:8000/health
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s
    networks:
      - antrasha_net

  ai-ingest-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "jobs.ai_ingest_worker"]
    env_file:
      - ./env/.env.backend.prod
      - ./env/.env.postgres.prod
    volumes:
      - antrasha_ai_ingest_tmp:/app/var/ai_ingest_tmp
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - antrasha_net

  try-on-worker:
    profiles: ["gpu"]
    build:
      context: ../backend
      dockerfile: Dockerfile.vton_worker
    restart: unless-stopped
    command: ["python", "-m", "jobs.try_on_worker"]
    env_file:
      - ./env/.env.backend.prod
      - ./env/.env.postgres.prod
    environment:
      - VTON_WEIGHTS_DIR=/app/var/vton_weights
      - VTON_WEIGHTS_VERSION=1.5.0
      - HF_HOME=/app/var/hf_cache
    volumes:
      - antrasha_vton_weights:/app/var/vton_weights
      - antrasha_vton_hf_cache:/app/var/hf_cache
      - antrasha_try_on_tmp:/app/var/try_on_tmp
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - antrasha_net

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - antrasha_net

  admin:
    build:
      context: ..
      dockerfile: admin/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - antrasha_net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    env_file:
      - ./env/.env.prod
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      admin:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/letsencrypt:/etc/letsencrypt
      - ./nginx/acme:/var/www/certbot
    networks:
      - antrasha_net

  certbot:
    image: certbot/certbot:latest
    profiles: ["ops"]
    volumes:
      - ./nginx/letsencrypt:/etc/letsencrypt
      - ./nginx/acme:/var/www/certbot

volumes:
  antrasha_pg_data:
  antrasha_promo_media:
  antrasha_ai_ingest_tmp:
  antrasha_vton_weights:
  antrasha_vton_hf_cache:
  antrasha_try_on_tmp:

networks:
  antrasha_net:
    driver: bridge
